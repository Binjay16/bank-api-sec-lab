name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  brakeman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Brakeman (all checks, fail on any warning)
        run: bundle exec brakeman --run-all-checks --no-pager --exit-on-warn --exit-on-error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bin/rails db:schema:load
        env:
          RAILS_ENV: test
      - run: bin/rails test
